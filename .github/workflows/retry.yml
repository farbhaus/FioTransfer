name: Retry

# GitHub cancels a job it can't find a machine for ("The job was not acquired
# by Runner…", after ~15 min in the macOS arm64 queue), and no setting makes
# that wait longer. Re-run such a Build, up to 4 attempts in all.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: write # re-run
  checks: read   # job annotations

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.run_attempt < 4 &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run a build that never got a machine
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          # Jobs that ended without running a step, then GitHub's reason.
          for job in $(gh api "repos/$GH_REPO/actions/runs/$RUN/jobs" --jq '.jobs[] | select((.steps | length) == 0 and (.conclusion == "cancelled" or .conclusion == "failure")) | .id'); do
            if gh api "repos/$GH_REPO/check-runs/$job/annotations" --jq '.[].message' | grep -q "was not acquired by Runner"; then
              echo "Job $job never got a machine; re-running run $RUN"
              gh run rerun "$RUN"
              exit 0
            fi
          done
          echo "Not a runner shortage; nothing to do"
