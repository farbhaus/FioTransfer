name: package

# Builds unsigned binaries for macOS, Linux and Windows, and cuts a release when
# the version in Cargo.toml is new.
#
# ONE APP. FioTransfer is the egui application (`egui-ui`, package
# `fiotransfer-egui`). It is what is packaged, and it is packaged everywhere: an
# unsigned .app, a .deb and an AppImage, and an NSIS installer. The
# Wails-compatible WKWebView shell that used to be the macOS bundle is gone.
#
# THE CLI RIDES ALONG. `docs/PORTAL.md` tells the reader to run `fio portal …`,
# so every bundle carries the root package's `fio` beside the GUI — the
# `[[package.metadata.packager.binaries]]` entries in `egui-ui/Cargo.toml` list
# both, and the hook below builds both. `fio` is never `main`: the bundle, the
# desktop entry, the AppImage and the installer are still named after the GUI.
# (`fio-bench` ships nothing.)
#
# THE VERSION LIVES IN ONE PLACE: `[package] version` in Cargo.toml (currently
# 1.3.0, the version the original app is at). Everything else follows it:
#   * the version job below reads the manifest, not this file;
#   * every crate's packager metadata omits `version`, so each bundle takes the
#     crate version — and the three crates are at the same one;
#   * `fiotransfer_core::VERSION` reports `env!("CARGO_PKG_VERSION")` unless a
#     build overrides it with FIO_VERSION (development builds);
#   * a release is cut only when the tag for that version does not exist yet.
# Bump Cargo.toml, push to main, and a release appears. Nothing else to edit.
#
# Nothing here is signed with a certificate: no Developer ID, no notarisation, no
# Authenticode. The macOS bundle is ad-hoc signed, which is not a signature you
# can trust either — it only stops Gatekeeper calling an unsigned download
# "damaged".
#
# THE UPDATER FEED IS SIGNED, THOUGH, AND THAT IS A DIFFERENT SIGNATURE. Every
# artifact also gets a minisign signature (`cargo packager signer sign`, which
# writes `<asset>.sig`), and the release carries `latest.json`: a manifest that
# names each artifact, repeats its signature, and says which format it is. The
# in-app updater trusts nothing it cannot verify against the public key compiled
# into it, so those two files are the whole security story of an update —
# `docs/UPDATES.md` is the long version.
#
# The private key is the repository secret `CARGO_PACKAGER_SIGN_PRIVATE_KEY`,
# which is cargo-packager's own environment variable, so it is never written to
# disk and never appears on a command line. A fork PR has no secrets: every
# signing step then warns and skips instead of failing, the packages still build
# and upload, and the release publishes no `latest.json` — a feed nobody can
# verify is worse than no feed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Pull requests build the packages too, so a packaging change is proven before
  # it lands — but the release job below can only run for a push to main.
  pull_request:
    paths:
      - "Cargo.toml"
      - "core/Cargo.toml"
      - "egui-ui/Cargo.toml"
      - ".github/workflows/packager.yml"
      - "build/icons/**"
      # The feed builder is proven on a PR too: it needs the assets, and it fails
      # loudly rather than publishing something the updater cannot parse.
      - "scripts/latest-json.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The one crate that produces an application.
  APP: fiotransfer-egui

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the version, and decide whether it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One source of truth: the manifest, not this file.
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "Cargo.toml says $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A release exists already? Then this push is not a release.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual run: packaging only"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released: packaging only"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new: this run will release it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # macOS: the app as it ships, one bundle.
  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - uses: Swatinem/rust-cache@v2
      # `egui-ui` carries the packager metadata; the bundle lands in dist-egui/.
      - name: Package (unsigned)
        run: cargo packager -p "$APP" --formats app
      # An unsigned .app that arrives in a zip is quarantined by Gatekeeper and
      # macOS says it is "damaged". An ad-hoc signature makes it a normal
      # unidentified-developer app instead, which opens after right-click -> Open.
      - name: Ad-hoc sign (no certificate, no notarisation)
        run: |
          set -euo pipefail
          codesign --force --deep -s - dist-egui/FioTransfer.app
          codesign --verify --deep --strict dist-egui/FioTransfer.app
      - name: Name the bundle with the version
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          mkdir -p out
          ditto -c -k --keepParent dist-egui/FioTransfer.app "out/FioTransfer-$V-macos-app.zip"
          # The same bundle as a .tar.gz. cargo-packager-updater's own macOS
          # installer unpacks a gzip stream with tar::Archive and dies on a zip
          # ("invalid gzip header"), and it drops the tar's first path component
          # before renaming what is left over the old bundle — so the archive
          # holds exactly one top-level entry, `FioTransfer.app`.
          # `--no-mac-metadata` keeps AppleDouble `._*` files out of it.
          # The feed points at the zip by default; `--macos-artifact tar.gz` in
          # the release job's latest-json.py call flips it to this one.
          tar --no-mac-metadata -czf "out/FioTransfer-$V-macos-app.tar.gz" -C dist-egui FioTransfer.app
          ls -l out
      # --- the updater feed: sign each artifact, and say what it is for ------
      # `latest.json` keys `platforms` by "<os>-<arch>", where <os> comes from
      # cargo-packager-updater's own `target()`: "macos", not "darwin". The arch
      # is a property of the machine that built these bytes, so this job records
      # it next to the artifacts and scripts/latest-json.py reads the record back
      # instead of guessing (macos-latest is arm64 today and is not promised to stay that way).
      - name: Record the updater target
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64 | aarch64) ARCH=aarch64 ;;
            x86_64) ARCH=x86_64 ;;
            *) echo "::error::unknown architecture $(uname -m): teach scripts/latest-json.py this target key"; exit 1 ;;
          esac
          echo "macos-$ARCH" > out/updater-target-macos.txt
      # `cargo packager signer sign` takes the key from
      # CARGO_PACKAGER_SIGN_PRIVATE_KEY itself, so the key is never a file and
      # never a command-line argument. It exits 1 when the variable is missing,
      # so the absence is checked here instead: a fork PR has no secrets and must
      # still build.
      - name: Sign each artifact for the updater
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_PACKAGER_SIGN_PRIVATE_KEY:-}" ]; then
            echo "::warning title=Updater signatures skipped::CARGO_PACKAGER_SIGN_PRIVATE_KEY is not set (a fork PR has no secrets). These packages are unsigned, and the release job will publish no latest.json for them."
            exit 0
          fi
          for f in out/*; do
            case "$f" in *.sig | *.txt) continue ;; esac
            echo "signing $f"
            cargo packager signer sign "$f"
          done
          ls -l out
          # Which bytes were signed, in the log: the signature covers these and
          # nothing else, so the file may be renamed without invalidating it.
          { sha256sum out/* || shasum -a 256 out/*; } || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  # Linux: the same app, as a .deb and an AppImage.
  linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      # linuxdeploy ships as an AppImage; without FUSE in the runner it has to
      # unpack itself instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libwayland-dev libudev-dev libssl-dev \
            fuse libfuse2 file
      - name: Package (unsigned)
        run: cargo packager -p "$APP" --formats deb,appimage
      - name: Collect with the version in the name
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          mkdir -p out
          for f in dist-egui/*.deb dist-egui/*.AppImage; do
            [ -e "$f" ] || continue
            base=$(basename "$f"); ext="${base##*.}"
            cp "$f" "out/FioTransfer-$V-linux.$ext"
          done
          ls -l out
      # --- the updater feed: sign each artifact, and say what it is for ------
      # `latest.json` keys `platforms` by "<os>-<arch>", where <os> comes from
      # cargo-packager-updater's own `target()`: "macos", not "darwin". The arch
      # is a property of the machine that built these bytes, so this job records
      # it next to the artifacts and scripts/latest-json.py reads the record back
      # instead of guessing (ubuntu-latest is x86_64 today).
      - name: Record the updater target
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) ARCH=x86_64 ;;
            aarch64 | arm64) ARCH=aarch64 ;;
            *) echo "::error::unknown architecture $(uname -m): teach scripts/latest-json.py this target key"; exit 1 ;;
          esac
          echo "linux-$ARCH" > out/updater-target-linux.txt
      # `cargo packager signer sign` takes the key from
      # CARGO_PACKAGER_SIGN_PRIVATE_KEY itself, so the key is never a file and
      # never a command-line argument. It exits 1 when the variable is missing,
      # so the absence is checked here instead: a fork PR has no secrets and must
      # still build.
      - name: Sign each artifact for the updater
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_PACKAGER_SIGN_PRIVATE_KEY:-}" ]; then
            echo "::warning title=Updater signatures skipped::CARGO_PACKAGER_SIGN_PRIVATE_KEY is not set (a fork PR has no secrets). These packages are unsigned, and the release job will publish no latest.json for them."
            exit 0
          fi
          for f in out/*; do
            case "$f" in *.sig | *.txt) continue ;; esac
            echo "signing $f"
            cargo packager signer sign "$f"
          done
          ls -l out
          # Which bytes were signed, in the log: the signature covers these and
          # nothing else, so the file may be renamed without invalidating it.
          { sha256sum out/* || shasum -a 256 out/*; } || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  # Windows: the same app, as an NSIS installer.
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8
      - uses: Swatinem/rust-cache@v2
      - name: Package (unsigned)
        run: cargo packager -p "$env:APP" --formats nsis
      - name: Collect with the version in the name
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          mkdir -p out
          for f in dist-egui/*.exe; do
            [ -e "$f" ] || continue
            cp "$f" "out/FioTransfer-$V-windows-setup.exe"
          done
          ls -l out
      # --- the updater feed: sign each artifact, and say what it is for ------
      # `latest.json` keys `platforms` by "<os>-<arch>", where <os> comes from
      # cargo-packager-updater's own `target()`: "macos", not "darwin". The arch
      # is a property of the machine that built these bytes, so this job records
      # it next to the artifacts and scripts/latest-json.py reads the record back
      # instead of guessing (a windows-latest runner is x86_64 today).
      - name: Record the updater target
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64 | AMD64 | amd64) ARCH=x86_64 ;;
            aarch64 | ARM64) ARCH=aarch64 ;;
            *) echo "::error::unknown architecture $(uname -m): teach scripts/latest-json.py this target key"; exit 1 ;;
          esac
          echo "windows-$ARCH" > out/updater-target-windows.txt
      # `cargo packager signer sign` takes the key from
      # CARGO_PACKAGER_SIGN_PRIVATE_KEY itself, so the key is never a file and
      # never a command-line argument. It exits 1 when the variable is missing,
      # so the absence is checked here instead: a fork PR has no secrets and must
      # still build.
      - name: Sign each artifact for the updater
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_PACKAGER_SIGN_PRIVATE_KEY:-}" ]; then
            echo "::warning title=Updater signatures skipped::CARGO_PACKAGER_SIGN_PRIVATE_KEY is not set (a fork PR has no secrets). These packages are unsigned, and the release job will publish no latest.json for them."
            exit 0
          fi
          for f in out/*; do
            case "$f" in *.sig | *.txt) continue ;; esac
            echo "signing $f"
            cargo packager signer sign "$f"
          done
          ls -l out
          # Which bytes were signed, in the log: the signature covers these and
          # nothing else, so the file may be renamed without invalidating it.
          { sha256sum out/* || shasum -a 256 out/*; } || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  release:
    needs: [version, macos, linux, windows]
    # Only a push to main releases. A pull request builds everything and stops.
    if: needs.version.outputs.release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The feed builder is `scripts/latest-json.py`, and this job starts with no
      # source tree — it is the only job that needs one besides the builds.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Show what will be released
        run: ls -lR artifacts
      # ONE copy of the notes: the body `latest.json` carries and the body on the
      # release page are the same file, so they cannot drift.
      - name: Write the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Unsigned builds of FioTransfer $VERSION, from Cargo.toml.

          One app, three platforms: the same egui application, built from
          \`egui-ui\` on the real engine (\`core/\`).
          macOS: FioTransfer.app, ad-hoc signed.
          Linux: .deb and .AppImage.
          Windows: NSIS installer.

          Every artifact also carries a \`.sig\`, and this release carries
          \`latest.json\`: the in-app updater checks an update against both, so
          an update it installs is the file that was built and signed here.
          https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json

          Nothing here is signed with a certificate or notarised.
          EOF
          cat release-notes.md
      # The feed is built from the assets themselves, so it can neither name a
      # file the release does not carry nor repeat a signature for another file.
      # `scripts/latest-json.py` takes the `<os>-<arch>` keys from the records
      # the build jobs wrote, and fails rather than guessing.
      - name: Build latest.json (the updater feed)
        id: feed
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # No signatures, no feed: an entry a client cannot verify would only
          # make the updater fail after downloading the whole artifact.
          if ! compgen -G "artifacts/*.sig" > /dev/null; then
            echo "::warning title=No updater feed::no artifact is signed (CARGO_PACKAGER_SIGN_PRIVATE_KEY is not set), so latest.json is not published and applications will not see this release through the updater."
            echo "feed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/latest-json.py \
            --dir artifacts \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md \
            --out artifacts/latest.json
          echo "feed=yes" >> "$GITHUB_OUTPUT"
          cat artifacts/latest.json
      - name: Drop the target records, which are build notes and not assets
        run: rm -f artifacts/updater-target-*.txt
      - name: Create the release for this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FioTransfer $VERSION" \
            --notes-file release-notes.md
      - name: Say where the feed is, and whether there is one
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FEED: ${{ steps.feed.outputs.feed }}
        run: |
          set -euo pipefail
          if [ "$FEED" = "yes" ]; then
            echo "updater feed: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no updater feed: v$VERSION carries no latest.json, because nothing was signed" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
