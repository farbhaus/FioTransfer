[package]
name = "fiotransfer-sys"
version = "0.1.0"
edition = "2021"
description = "The C boundary of FioTransfer: the AppKit shims in mac/ and the libc calls, behind safe functions"

[lib]
name = "fiotransfer_sys"
path = "src/lib.rs"

[dependencies]
libc = "0.2"

# On Windows the C boundary is kernel32, not libc: `file_id` asks
# `GetFileInformationByHandle` for the pair that means "the same file" there. The
# bindings are the generated SDK ones (already in this workspace's tree through
# `winit`), not a hand-copied struct.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[build-dependencies]
cc = "1.10.0"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
